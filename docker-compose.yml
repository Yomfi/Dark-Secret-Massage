# Optional local MySQL for development (not production Hostinger credentials).
# Production still uses the legacy Hostinger DB/user names documented in HOSTINGER.md.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: massager_studio
      MYSQL_USER: massager_studio
      MYSQL_PASSWORD: massager_studio
    volumes:
      - massager_studio_mysql:/var/lib/mysql

volumes:
  massager_studio_mysql:
